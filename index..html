<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Grand Livre — Compta simple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAF1FB;
    --paper-line: #CCDFF3;
    --ink: #101820;
    --ink-soft: #45566A;
    --red: #8F2E22;
    --gold: #93711F;
    --card: #FFFFFF;
    --card-border: #C6DAF0;
    --white: #FFFFFF;
  }
  html{ color-scheme: light; background:var(--paper); }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--paper);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 27px,
      var(--paper-line) 28px
    );
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .app{ display:flex; min-height:100vh; }
  .app{ flex-direction:column; }
  @media(min-width:860px){ .app{ flex-direction:row; } }

  /* Sidebar */
  .side{
    background:var(--white);
    color:var(--ink);
    padding:20px 0;
    flex-shrink:0;
    border-bottom:1px solid var(--card-border);
  }
  @media(min-width:860px){ .side{ width:210px; min-height:100vh; border-bottom:none; border-right:1px solid var(--card-border); } }
  .brand{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:500;
    padding:0 20px 18px 20px;
    border-bottom:1px solid var(--card-border);
    margin-bottom:8px;
    color:var(--ink);
  }
  .brand small{ display:block; font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-soft); font-weight:400; margin-top:3px;}
  .tabs{ display:flex; overflow-x:auto; }
  @media(min-width:860px){ .tabs{ display:block; } }
  .tab{
    background:none; border:none; color:var(--ink-soft); text-align:left;
    font-family:'Inter',sans-serif; font-size:14.5px; font-weight:500;
    padding:11px 20px; cursor:pointer; white-space:nowrap;
    border-left:3px solid transparent;
    display:flex; align-items:center; gap:9px;
  }
  .tab .n{ font-family:'IBM Plex Mono', monospace; font-size:11px; opacity:.6; }
  .tab:hover{ background:var(--paper); color:var(--ink); }
  .tab.active{ background:var(--paper); color:var(--ink); border-left-color:var(--gold); font-weight:600; }

  /* Main */
  .main{ flex:1; padding:26px 18px 60px; max-width:980px; margin:0 auto; width:100%; }
  @media(min-width:860px){ .main{ padding:36px 40px 60px; } }

  h1.page-title{
    font-family:'Fraunces', serif; font-weight:500; font-size:28px;
    margin:0 0 4px 0; color:var(--ink);
  }
  .page-sub{ color:var(--ink-soft); font-size:14px; margin:0 0 26px 0; }

  .grid{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:640px){ .grid.cols-4{ grid-template-columns:repeat(4,1fr); } .grid.cols-2{grid-template-columns:1fr 1fr;} }

  .stat{
    background:var(--card); border:1px solid var(--card-border); border-radius:3px;
    padding:16px 16px 14px;
  }
  .stat .label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
  .stat .val{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat .val.neg{ color:var(--red); }
  .stat .val.pos{ color:#2C5C3F; }

  .card{
    background:var(--card); border:1px solid var(--card-border); border-radius:3px;
    padding:20px; margin-bottom:18px;
  }
  .card h2{ font-family:'Fraunces', serif; font-weight:500; font-size:18px; margin:0 0 14px 0; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:600; padding:6px 8px; border-bottom:1.5px solid var(--ink); }
  td{ padding:9px 8px; border-bottom:1px solid var(--card-border); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; }
  .empty{ color:var(--ink-soft); font-style:italic; padding:14px 8px; font-size:13.5px; }

  .badge{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:700; border:1px solid transparent; }
  .badge.brouillon{ background:#EDE8D8; color:#5C5133; border-color:#D9CFA9; }
  .badge.envoyee, .badge.envoye{ background:#D7E7F4; color:#1F4C68; border-color:#B7D3E8; }
  .badge.payee, .badge.accepte{ background:#D6EEDB; color:#1E4A2C; border-color:#B4DDBD; }
  .badge.refuse, .badge.retard{ background:#F6DAD6; color:#7A2419; border-color:#EAB8B1; }

  input, select, textarea{
    font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px;
    border:1px solid var(--card-border); border-radius:3px; background:var(--white);
    color:var(--ink); width:100%;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--gold); outline-offset:0; }
  label{ font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:4px; }
  .field{ margin-bottom:12px; }

  button{ font-family:'Inter',sans-serif; cursor:pointer; }
  .btn{
    background:var(--ink); color:var(--white); border:none; border-radius:3px;
    padding:9px 16px; font-size:13.5px; font-weight:600;
  }
  .btn:hover{ background:#2C4A38; }
  .btn.secondary{ background:none; color:var(--ink); border:1.5px solid var(--ink); }
  .btn.secondary:hover{ background:rgba(30,51,36,0.06); }
  .btn.danger{ background:none; color:var(--red); border:1.5px solid var(--red); }
  .btn.danger:hover{ background:rgba(162,59,46,0.08); }
  .btn.small{ padding:5px 11px; font-size:12.5px; }
  .btn.gold{ background:var(--gold); color:var(--white); }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }

  .modal-bg{
    position:fixed; inset:0; background:rgba(20,30,22,0.55); display:flex;
    align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto; z-index:50;
  }
  .modal{
    background:var(--white); border-radius:4px; padding:24px; max-width:640px; width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  .modal h2{ font-family:'Fraunces',serif; font-weight:500; margin:0 0 16px 0; font-size:20px;}
  .line-row{ display:grid; grid-template-columns:1fr 60px 90px 70px 30px; gap:6px; align-items:end; margin-bottom:8px; }
  .line-row label{ margin-bottom:3px; }
  .totals-box{ margin-top:14px; padding-top:14px; border-top:1.5px solid var(--ink); text-align:right; }
  .totals-box div{ margin-bottom:4px; font-size:14px; }
  .totals-box .final{ font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; margin-top:6px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

  .doc-preview{ background:var(--white); border-radius:4px; padding:30px 26px; }
  .doc-head{ display:flex; justify-content:space-between; gap:20px; margin-bottom:24px; flex-wrap:wrap;}
  .doc-head h1{ font-family:'Fraunces',serif; font-weight:500; font-size:24px; margin:0 0 6px 0; }
  .doc-meta{ font-size:13px; color:var(--ink-soft); line-height:1.6; }
  .doc-parties{ display:flex; justify-content:space-between; gap:20px; margin-bottom:20px; flex-wrap:wrap;}
  .doc-parties .p{ font-size:13.5px; line-height:1.6; }
  .doc-parties .p strong{ display:block; font-size:14px; margin-bottom:2px; }
  .legal{ font-size:11.5px; color:var(--ink-soft); margin-top:20px; line-height:1.7; border-top:1px solid var(--card-border); padding-top:14px; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .big{ font-family:'Fraunces',serif; font-size:19px; color:var(--ink); margin-bottom:6px; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:white; background-image:none; }
    .doc-preview{ box-shadow:none; padding:0; }
    .main{ padding:0; max-width:100%; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- Storage helpers ----------
async function loadAll() {
  const keys = ['settings','clients','devis','factures','transactions'];
  const out = {};
  for (const k of keys) {
    try {
      const r = await window.storage.get(k, false);
      out[k] = r ? JSON.parse(r.value) : null;
    } catch (e) {
      out[k] = null;
    }
  }
  return out;
}
async function save(key, value) {
  try { await window.storage.set(key, JSON.stringify(value), false); }
  catch(e){ console.error('storage error', key, e); }
}

const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtEUR = (n) => (Number(n)||0).toLocaleString('fr-FR', {style:'currency', currency:'EUR'});
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';

function lineTotals(lines, tvaExempt) {
  let ht = 0, tva = 0;
  (lines||[]).forEach(l => {
    const lineHT = (Number(l.qty)||0) * (Number(l.priceHT)||0);
    ht += lineHT;
    if (!tvaExempt) tva += lineHT * ((Number(l.tva)||0)/100);
  });
  return { ht, tva, ttc: ht + tva };
}

function nextNumber(list, prefix) {
  const year = new Date().getFullYear();
  const count = (list||[]).filter(x => (x.number||'').includes(String(year))).length + 1;
  return `${prefix}-${year}-${String(count).padStart(3,'0')}`;
}

// ---------- Default settings ----------
const DEFAULT_SETTINGS = {
  businessName: '', ownerName: '', address: '', siret: '', email: '', phone: '',
  tvaExempt: true, defaultTva: 20, paymentTerms: '30 jours', iban: ''
};

function App() {
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState('dashboard');
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [clients, setClients] = useState([]);
  const [devis, setDevis] = useState([]);
  const [factures, setFactures] = useState([]);
  const [transactions, setTransactions] = useState([]);

  useEffect(() => {
    loadAll().then(d => {
      if (d.settings) setSettings({...DEFAULT_SETTINGS, ...d.settings});
      if (d.clients) setClients(d.clients);
      if (d.devis) setDevis(d.devis);
      if (d.factures) setFactures(d.factures);
      if (d.transactions) setTransactions(d.transactions);
      setLoaded(true);
    });
  }, []);

  useEffect(() => { if(loaded) save('settings', settings); }, [settings, loaded]);
  useEffect(() => { if(loaded) save('clients', clients); }, [clients, loaded]);
  useEffect(() => { if(loaded) save('devis', devis); }, [devis, loaded]);
  useEffect(() => { if(loaded) save('factures', factures); }, [factures, loaded]);
  useEffect(() => { if(loaded) save('transactions', transactions); }, [transactions, loaded]);

  const clientName = (id) => clients.find(c => c.id === id)?.name || '—';

  const TABS = [
    {id:'dashboard', label:'Tableau de bord', n:'01'},
    {id:'factures', label:'Factures', n:'02'},
    {id:'devis', label:'Devis', n:'03'},
    {id:'transactions', label:'Revenus & dépenses', n:'04'},
    {id:'clients', label:'Clients', n:'05'},
    {id:'reglages', label:'Réglages', n:'06'},
  ];

  if (!loaded) return <div style={{padding:40, fontFamily:'Inter,sans-serif', color:'#4C6350'}}>Chargement du grand livre…</div>;

  return (
    <div className="app">
      <div className="side no-print">
        <div className="brand">Grand Livre<small>{settings.businessName || 'Compta & facturation'}</small></div>
        <div className="tabs">
          {TABS.map(t => (
            <button key={t.id} className={"tab" + (tab===t.id?" active":"")} onClick={()=>setTab(t.id)}>
              <span className="n">{t.n}</span>{t.label}
            </button>
          ))}
        </div>
      </div>
      <div className="main">
        {tab==='dashboard' && <Dashboard factures={factures} transactions={transactions} settings={settings} clientName={clientName} />}
        {tab==='factures' && <Factures factures={factures} setFactures={setFactures} clients={clients} settings={settings} clientName={clientName} devis={devis} />}
        {tab==='devis' && <Devis devis={devis} setDevis={setDevis} clients={clients} settings={settings} clientName={clientName} factures={factures} setFactures={setFactures} />}
        {tab==='transactions' && <Transactions transactions={transactions} setTransactions={setTransactions} />}
        {tab==='clients' && <Clients clients={clients} setClients={setClients} />}
        {tab==='reglages' && <Reglages settings={settings} setSettings={setSettings} />}
      </div>
    </div>
  );
}

// ---------- Dashboard ----------
function Dashboard({factures, transactions, settings, clientName}) {
  const stats = useMemo(() => {
    const facturesPayees = factures.filter(f => f.status === 'payee');
    const facturesEmises = factures.filter(f => f.status === 'envoyee' || f.status === 'payee');
    const caHT = facturesEmises.reduce((s,f)=> s + lineTotals(f.lines, settings.tvaExempt).ht, 0);
    const tvaCollectee = facturesEmises.reduce((s,f)=> s + lineTotals(f.lines, settings.tvaExempt).tva, 0);
    const encaisse = facturesPayees.reduce((s,f)=> s + lineTotals(f.lines, settings.tvaExempt).ttc, 0)
      + transactions.filter(t=>t.type==='revenu').reduce((s,t)=>s+(Number(t.amount)||0),0);
    const depenses = transactions.filter(t=>t.type==='depense').reduce((s,t)=>s+(Number(t.amount)||0),0);
    const impayees = factures.filter(f => f.status === 'envoyee');
    const impayeesTotal = impayees.reduce((s,f)=> s + lineTotals(f.lines, settings.tvaExempt).ttc, 0);
    return { caHT, tvaCollectee, encaisse, depenses, solde: encaisse - depenses, impayees, impayeesTotal };
  }, [factures, transactions, settings]);

  return (
    <div>
      <h1 className="page-title">Tableau de bord</h1>
      <p className="page-sub">Vue d'ensemble de ton activité{settings.businessName ? ` — ${settings.businessName}` : ''}.</p>

      <div className="grid cols-4">
        <div className="stat"><div className="label">Encaissé</div><div className="val pos">{fmtEUR(stats.encaisse)}</div></div>
        <div className="stat"><div className="label">Dépenses</div><div className="val neg">{fmtEUR(stats.depenses)}</div></div>
        <div className="stat"><div className="label">Solde de trésorerie</div><div className={"val " + (stats.solde>=0?'pos':'neg')}>{fmtEUR(stats.solde)}</div></div>
        <div className="stat"><div className="label">{settings.tvaExempt ? 'TVA' : 'TVA collectée à reverser'}</div><div className="val">{settings.tvaExempt ? 'Franchise' : fmtEUR(stats.tvaCollectee)}</div></div>
      </div>

      <div style={{height:18}}></div>

      <div className="card">
        <h2>Factures en attente de paiement</h2>
        {stats.impayees.length === 0 ? <div className="empty">Aucune facture en attente — tout est encaissé.</div> : (
          <table>
            <thead><tr><th>N°</th><th>Client</th><th>Échéance</th><th className="num">Montant TTC</th></tr></thead>
            <tbody>
              {stats.impayees.map(f => (
                <tr key={f.id}>
                  <td>{f.number}</td><td>{clientName(f.clientId)}</td><td>{fmtDate(f.dueDate)}</td>
                  <td className="num">{fmtEUR(lineTotals(f.lines, settings.tvaExempt).ttc)}</td>
                </tr>
              ))}
              <tr><td colSpan="3" style={{fontWeight:600}}>Total en attente</td><td className="num" style={{fontWeight:600}}>{fmtEUR(stats.impayeesTotal)}</td></tr>
            </tbody>
          </table>
        )}
      </div>

      <div className="card">
        <h2>Chiffre d'affaires (factures émises)</h2>
        <div style={{fontSize:14, color:'var(--ink-soft)'}}>CA HT cumulé : <strong style={{color:'var(--ink)'}}>{fmtEUR(stats.caHT)}</strong></div>
      </div>
    </div>
  );
}

// ---------- Line editor (shared by Devis/Factures forms) ----------
function LineEditor({lines, setLines, tvaExempt}) {
  const update = (i, field, val) => {
    const copy = [...lines];
    copy[i] = {...copy[i], [field]: val};
    setLines(copy);
  };
  const add = () => setLines([...lines, {desc:'', qty:1, priceHT:0, tva: 20}]);
  const remove = (i) => setLines(lines.filter((_,idx)=>idx!==i));

  return (
    <div>
      <div className="line-row" style={{marginBottom:4}}>
        <label>Désignation</label><label>Qté</label><label>Prix HT</label>{!tvaExempt && <label>TVA %</label>}{tvaExempt && <label></label>}<label></label>
      </div>
      {lines.map((l,i) => (
        <div className="line-row" key={i}>
          <input value={l.desc} placeholder="Prestation ou produit" onChange={e=>update(i,'desc',e.target.value)} />
          <input type="number" min="0" value={l.qty} onChange={e=>update(i,'qty',e.target.value)} />
          <input type="number" min="0" step="0.01" value={l.priceHT} onChange={e=>update(i,'priceHT',e.target.value)} />
          {!tvaExempt ? (
            <select value={l.tva} onChange={e=>update(i,'tva',e.target.value)}>
              <option value="20">20</option><option value="10">10</option><option value="5.5">5.5</option><option value="0">0</option>
            </select>
          ) : <div></div>}
          <button className="btn danger small" onClick={()=>remove(i)} title="Supprimer">✕</button>
        </div>
      ))}
      <button className="btn secondary small" onClick={add} style={{marginTop:6}}>+ Ajouter une ligne</button>
    </div>
  );
}

function TotalsBox({lines, tvaExempt}) {
  const t = lineTotals(lines, tvaExempt);
  return (
    <div className="totals-box">
      <div>Total HT : {fmtEUR(t.ht)}</div>
      {!tvaExempt && <div>Total TVA : {fmtEUR(t.tva)}</div>}
      <div className="final">Total {tvaExempt ? '' : 'TTC '}: {fmtEUR(t.ttc)}</div>
    </div>
  );
}

// ---------- Factures ----------
function Factures({factures, setFactures, clients, settings, clientName, devis}) {
  const [editing, setEditing] = useState(null); // facture object being edited, or null
  const [preview, setPreview] = useState(null); // facture being previewed/printed

  const openNew = () => setEditing({
    id: uid(), number: nextNumber(factures, 'FA'), date: todayISO(),
    dueDate: '', clientId: clients[0]?.id || '', lines: [{desc:'', qty:1, priceHT:0, tva:settings.defaultTva}],
    status: 'brouillon', notes: ''
  });

  const saveFacture = (f) => {
    setFactures(prev => {
      const exists = prev.some(x=>x.id===f.id);
      return exists ? prev.map(x=>x.id===f.id?f:x) : [...prev, f];
    });
    setEditing(null);
  };
  const removeFacture = (id) => { if(confirm('Supprimer cette facture ?')) setFactures(prev=>prev.filter(x=>x.id!==id)); };
  const setStatus = (id, status) => setFactures(prev => prev.map(f => f.id===id ? {...f, status} : f));

  if (preview) return <DocPreview doc={preview} type="Facture" settings={settings} clientName={clientName} clients={clients} onClose={()=>setPreview(null)} />;

  return (
    <div>
      <div className="toolbar no-print">
        <div><h1 className="page-title">Factures</h1><p className="page-sub">Crée et suis tes factures.</p></div>
        <button className="btn" onClick={openNew} disabled={clients.length===0}>+ Nouvelle facture</button>
      </div>
      {clients.length===0 && <div className="card"><div className="empty">Ajoute d'abord un client dans l'onglet "Clients" pour créer une facture.</div></div>}

      <div className="card">
        {factures.length===0 ? <div className="empty-state"><div className="big">Aucune facture pour l'instant</div>Crée ta première facture pour commencer à suivre ton activité.</div> : (
          <table>
            <thead><tr><th>N°</th><th>Client</th><th>Date</th><th>Statut</th><th className="num">Montant</th><th></th></tr></thead>
            <tbody>
              {factures.slice().reverse().map(f => (
                <tr key={f.id}>
                  <td>{f.number}</td><td>{clientName(f.clientId)}</td><td>{fmtDate(f.date)}</td>
                  <td><span className={"badge " + f.status}>{ {brouillon:'Brouillon', envoyee:'Envoyée', payee:'Payée'}[f.status] }</span></td>
                  <td className="num">{fmtEUR(lineTotals(f.lines, settings.tvaExempt).ttc)}</td>
                  <td>
                    <div className="row-actions">
                      <button className="btn secondary small" onClick={()=>setPreview(f)}>Voir</button>
                      <button className="btn secondary small" onClick={()=>setEditing(f)}>Éditer</button>
                      {f.status!=='payee' && <button className="btn gold small" onClick={()=>setStatus(f.id, f.status==='brouillon'?'envoyee':'payee')}>{f.status==='brouillon'?'Marquer envoyée':'Marquer payée'}</button>}
                      <button className="btn danger small" onClick={()=>removeFacture(f.id)}>Suppr.</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {editing && <FactureModal doc={editing} clients={clients} settings={settings} onSave={saveFacture} onClose={()=>setEditing(null)} />}
    </div>
  );
}

function FactureModal({doc, clients, settings, onSave, onClose}) {
  const [f, setF] = useState(doc);
  return (
    <div className="modal-bg no-print" onClick={(e)=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="modal">
        <h2>{doc.number}</h2>
        <div className="grid cols-2">
          <div className="field"><label>Client</label>
            <select value={f.clientId} onChange={e=>setF({...f, clientId:e.target.value})}>
              {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div className="field"><label>Date d'émission</label>
            <input type="date" value={f.date} onChange={e=>setF({...f, date:e.target.value})} />
          </div>
          <div className="field"><label>Date d'échéance</label>
            <input type="date" value={f.dueDate} onChange={e=>setF({...f, dueDate:e.target.value})} />
          </div>
        </div>
        <LineEditor lines={f.lines} setLines={(lines)=>setF({...f, lines})} tvaExempt={settings.tvaExempt} />
        <TotalsBox lines={f.lines} tvaExempt={settings.tvaExempt} />
        <div className="field" style={{marginTop:12}}><label>Notes (optionnel)</label>
          <textarea rows="2" value={f.notes} onChange={e=>setF({...f, notes:e.target.value})} />
        </div>
        <div className="modal-actions">
          <button className="btn secondary" onClick={onClose}>Annuler</button>
          <button className="btn" onClick={()=>onSave(f)}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

// ---------- Devis ----------
function Devis({devis, setDevis, clients, settings, clientName, factures, setFactures}) {
  const [editing, setEditing] = useState(null);
  const [preview, setPreview] = useState(null);

  const openNew = () => setEditing({
    id: uid(), number: nextNumber(devis, 'DE'), date: todayISO(),
    validUntil: '', clientId: clients[0]?.id || '', lines: [{desc:'', qty:1, priceHT:0, tva:settings.defaultTva}],
    status: 'brouillon', notes: ''
  });

  const saveDevis = (d) => {
    setDevis(prev => {
      const exists = prev.some(x=>x.id===d.id);
      return exists ? prev.map(x=>x.id===d.id?d:x) : [...prev, d];
    });
    setEditing(null);
  };
  const removeDevis = (id) => { if(confirm('Supprimer ce devis ?')) setDevis(prev=>prev.filter(x=>x.id!==id)); };
  const setStatus = (id, status) => setDevis(prev => prev.map(d => d.id===id ? {...d, status} : d));

  const convertToFacture = (d) => {
    const f = {
      id: uid(), number: nextNumber(factures, 'FA'), date: todayISO(), dueDate: '',
      clientId: d.clientId, lines: d.lines, status: 'brouillon', notes: d.notes, fromDevisId: d.id
    };
    setFactures(prev => [...prev, f]);
    setStatus(d.id, 'accepte');
    alert(`Facture ${f.number} créée depuis le devis ${d.number}.`);
  };

  if (preview) return <DocPreview doc={preview} type="Devis" settings={settings} clientName={clientName} clients={clients} onClose={()=>setPreview(null)} />;

  return (
    <div>
      <div className="toolbar no-print">
        <div><h1 className="page-title">Devis</h1><p className="page-sub">Établis un devis, puis convertis-le en facture une fois accepté.</p></div>
        <button className="btn" onClick={openNew} disabled={clients.length===0}>+ Nouveau devis</button>
      </div>
      {clients.length===0 && <div className="card"><div className="empty">Ajoute d'abord un client dans l'onglet "Clients" pour créer un devis.</div></div>}

      <div className="card">
        {devis.length===0 ? <div className="empty-state"><div className="big">Aucun devis pour l'instant</div>Prépare un devis avant de facturer une prestation.</div> : (
          <table>
            <thead><tr><th>N°</th><th>Client</th><th>Date</th><th>Statut</th><th className="num">Montant</th><th></th></tr></thead>
            <tbody>
              {devis.slice().reverse().map(d => (
                <tr key={d.id}>
                  <td>{d.number}</td><td>{clientName(d.clientId)}</td><td>{fmtDate(d.date)}</td>
                  <td><span className={"badge " + d.status}>{ {brouillon:'Brouillon', envoye:'Envoyé', accepte:'Accepté', refuse:'Refusé'}[d.status] }</span></td>
                  <td className="num">{fmtEUR(lineTotals(d.lines, settings.tvaExempt).ttc)}</td>
                  <td>
                    <div className="row-actions">
                      <button className="btn secondary small" onClick={()=>setPreview(d)}>Voir</button>
                      <button className="btn secondary small" onClick={()=>setEditing(d)}>Éditer</button>
                      {d.status==='brouillon' && <button className="btn gold small" onClick={()=>setStatus(d.id,'envoye')}>Marquer envoyé</button>}
                      {d.status==='envoye' && !d.fromDevisId && <button className="btn gold small" onClick={()=>convertToFacture(d)}>Convertir en facture</button>}
                      {d.status==='accepte' && <span style={{fontSize:12, color:'var(--ink-soft)'}}>Facturé</span>}
                      <button className="btn danger small" onClick={()=>removeDevis(d.id)}>Suppr.</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {editing && <DevisModal doc={editing} clients={clients} settings={settings} onSave={saveDevis} onClose={()=>setEditing(null)} />}
    </div>
  );
}

// ---------- Document preview (print-friendly) ----------
function DocPreview({doc, type, settings, clientName, clients, onClose}) {
  const client = clients.find(c=>c.id===doc.clientId);
  const t = lineTotals(doc.lines, settings.tvaExempt);
  return (
    <div>
      <div className="toolbar no-print">
        <button className="btn secondary" onClick={onClose}>← Retour</button>
        <button className="btn" onClick={()=>window.print()}>Imprimer / Exporter en PDF</button>
      </div>
      <div className="doc-preview">
        <div className="doc-head">
          <div>
            <h1>{type} {doc.number}</h1>
            <div className="doc-meta">
              Date : {fmtDate(doc.date)}<br/>
              {type==='Facture' ? (doc.dueDate ? <>Échéance : {fmtDate(doc.dueDate)}</> : null) : (doc.validUntil ? <>Valable jusqu'au : {fmtDate(doc.validUntil)}</> : null)}
            </div>
          </div>
        </div>
        <div className="doc-parties">
          <div className="p">
            <strong>{settings.businessName || settings.ownerName || 'Votre entreprise'}</strong>
            {settings.ownerName && settings.businessName && <>{settings.ownerName}<br/></>}
            {settings.address && <>{settings.address}<br/></>}
            {settings.siret && <>SIRET : {settings.siret}<br/></>}
            {settings.email && <>{settings.email}<br/></>}
            {settings.phone && <>{settings.phone}</>}
          </div>
          <div className="p">
            <strong>Client</strong>
            {client?.name}<br/>
            {client?.address && <>{client.address}<br/></>}
            {client?.email && <>{client.email}</>}
          </div>
        </div>
        <table>
          <thead><tr><th>Désignation</th><th className="num">Qté</th><th className="num">Prix HT</th>{!settings.tvaExempt && <th className="num">TVA</th>}<th className="num">Total HT</th></tr></thead>
          <tbody>
            {doc.lines.map((l,i)=>(
              <tr key={i}>
                <td>{l.desc || '—'}</td><td className="num">{l.qty}</td><td className="num">{fmtEUR(l.priceHT)}</td>
                {!settings.tvaExempt && <td className="num">{l.tva}%</td>}
                <td className="num">{fmtEUR((Number(l.qty)||0)*(Number(l.priceHT)||0))}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <TotalsBox lines={doc.lines} tvaExempt={settings.tvaExempt} />
        {doc.notes && <div style={{marginTop:16, fontSize:13.5}}><strong>Notes :</strong> {doc.notes}</div>}
        <div className="legal">
          {settings.tvaExempt && <>TVA non applicable, art. 293 B du CGI.<br/></>}
          {type==='Facture' && <>Conditions de paiement : {settings.paymentTerms || '30 jours'}.
            En cas de retard de paiement, indemnité forfaitaire pour frais de recouvrement de 40 €, et pénalités de retard au taux légal en vigueur.<br/></>}
          {settings.iban && <>IBAN : {settings.iban}<br/></>}
        </div>
      </div>
    </div>
  );
}

// ---------- Transactions ----------
function Transactions({transactions, setTransactions}) {
  const [form, setForm] = useState({type:'revenu', date: todayISO(), label:'', amount:'', category:''});

  const add = () => {
    if (!form.label || !form.amount) return;
    setTransactions(prev => [...prev, {...form, id: uid(), amount: Number(form.amount)}]);
    setForm({type:form.type, date: todayISO(), label:'', amount:'', category:''});
  };
  const remove = (id) => setTransactions(prev => prev.filter(t=>t.id!==id));

  const totals = useMemo(() => {
    const rev = transactions.filter(t=>t.type==='revenu').reduce((s,t)=>s+Number(t.amount),0);
    const dep = transactions.filter(t=>t.type==='depense').reduce((s,t)=>s+Number(t.amount),0);
    return {rev, dep};
  }, [transactions]);

  return (
    <div>
      <h1 className="page-title">Revenus & dépenses</h1>
      <p className="page-sub">Encaissements hors facturation (espèces, virements divers) et toutes tes dépenses professionnelles.</p>

      <div className="card">
        <h2>Ajouter une ligne</h2>
        <div className="grid cols-4">
          <div className="field"><label>Type</label>
            <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
              <option value="revenu">Revenu</option><option value="depense">Dépense</option>
            </select>
          </div>
          <div className="field"><label>Date</label><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} /></div>
          <div className="field"><label>Libellé</label><input value={form.label} placeholder="Ex : Achat matériel" onChange={e=>setForm({...form,label:e.target.value})} /></div>
          <div className="field"><label>Montant (€)</label><input type="number" step="0.01" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} /></div>
        </div>
        <div className="grid cols-2">
          <div className="field"><label>Catégorie (optionnel)</label><input value={form.category} placeholder="Ex : Fournitures, Déplacement…" onChange={e=>setForm({...form,category:e.target.value})} /></div>
        </div>
        <button className="btn" onClick={add}>Ajouter</button>
      </div>

      <div className="card">
        {transactions.length===0 ? <div className="empty">Aucune ligne enregistrée.</div> : (
          <table>
            <thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th>Type</th><th className="num">Montant</th><th></th></tr></thead>
            <tbody>
              {transactions.slice().reverse().map(t => (
                <tr key={t.id}>
                  <td>{fmtDate(t.date)}</td><td>{t.label}</td><td>{t.category || '—'}</td>
                  <td><span className={"badge " + (t.type==='revenu'?'accepte':'refuse')}>{t.type==='revenu'?'Revenu':'Dépense'}</span></td>
                  <td className="num" style={{color: t.type==='depense' ? 'var(--red)' : '#2C5C3F'}}>{t.type==='depense'?'−':'+'}{fmtEUR(t.amount)}</td>
                  <td><button className="btn danger small" onClick={()=>remove(t.id)}>Suppr.</button></td>
                </tr>
              ))}
              <tr><td colSpan="4" style={{fontWeight:600}}>Total</td><td className="num" style={{fontWeight:600}}>{fmtEUR(totals.rev - totals.dep)}</td><td></td></tr>
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ---------- Clients ----------
function Clients({clients, setClients}) {
  const [form, setForm] = useState({name:'', email:'', address:''});
  const add = () => {
    if (!form.name) return;
    setClients(prev => [...prev, {...form, id: uid()}]);
    setForm({name:'', email:'', address:''});
  };
  const remove = (id) => { if(confirm('Supprimer ce client ?')) setClients(prev=>prev.filter(c=>c.id!==id)); };

  return (
    <div>
      <h1 className="page-title">Clients</h1>
      <p className="page-sub">Ta liste de clients, pour les rattacher à tes devis et factures.</p>

      <div className="card">
        <h2>Ajouter un client</h2>
        <div className="grid cols-2">
          <div className="field"><label>Nom / Raison sociale</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} /></div>
          <div className="field"><label>Email</label><input value={form.email} onChange={e=>setForm({...form,email:e.target.value})} /></div>
        </div>
        <div className="field"><label>Adresse</label><input value={form.address} onChange={e=>setForm({...form,address:e.target.value})} /></div>
        <button className="btn" onClick={add}>Ajouter</button>
      </div>

      <div className="card">
        {clients.length===0 ? <div className="empty">Aucun client enregistré.</div> : (
          <table>
            <thead><tr><th>Nom</th><th>Email</th><th>Adresse</th><th></th></tr></thead>
            <tbody>
              {clients.map(c => (
                <tr key={c.id}>
                  <td>{c.name}</td><td>{c.email || '—'}</td><td>{c.address || '—'}</td>
                  <td><button className="btn danger small" onClick={()=>remove(c.id)}>Suppr.</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ---------- Réglages ----------
function Reglages({settings, setSettings}) {
  const [s, setS] = useState(settings);
  useEffect(()=>setS(settings), [settings]);
  const save = () => { setSettings(s); alert('Réglages enregistrés.'); };

  return (
    <div>
      <h1 className="page-title">Réglages</h1>
      <p className="page-sub">Les informations de cette page apparaissent sur tes devis et factures.</p>

      <div className="card">
        <div className="grid cols-2">
          <div className="field"><label>Nom de l'activité / entreprise</label><input value={s.businessName} onChange={e=>setS({...s,businessName:e.target.value})} /></div>
          <div className="field"><label>Ton nom</label><input value={s.ownerName} onChange={e=>setS({...s,ownerName:e.target.value})} /></div>
          <div className="field"><label>SIRET</label><input value={s.siret} onChange={e=>setS({...s,siret:e.target.value})} /></div>
          <div className="field"><label>Email</label><input value={s.email} onChange={e=>setS({...s,email:e.target.value})} /></div>
          <div className="field"><label>Téléphone</label><input value={s.phone} onChange={e=>setS({...s,phone:e.target.value})} /></div>
          <div className="field"><label>IBAN (optionnel, affiché sur les factures)</label><input value={s.iban} onChange={e=>setS({...s,iban:e.target.value})} /></div>
        </div>
        <div className="field"><label>Adresse</label><input value={s.address} onChange={e=>setS({...s,address:e.target.value})} /></div>
        <div className="field"><label>Conditions de paiement</label><input value={s.paymentTerms} onChange={e=>setS({...s,paymentTerms:e.target.value})} /></div>
        <div className="field" style={{display:'flex', alignItems:'center', gap:8, marginTop:16}}>
          <input type="checkbox" style={{width:'auto'}} checked={s.tvaExempt} onChange={e=>setS({...s,tvaExempt:e.target.checked})} id="tvaex" />
          <label htmlFor="tvaex" style={{margin:0}}>Je suis en franchise en base de TVA (auto-entrepreneur non assujetti — mention « TVA non applicable, art. 293 B du CGI » affichée automatiquement)</label>
        </div>
        <button className="btn" onClick={save} style={{marginTop:16}}>Enregistrer</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
